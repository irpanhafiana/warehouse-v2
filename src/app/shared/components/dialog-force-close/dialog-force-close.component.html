@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 animate-modal-backdrop">
  <div class="w-full max-w-sm bg-white rounded-2xl p-6 border border-gray-200 animate-modal-card">
    <div class="flex justify-between items-center pb-3 border-b border-gray-100">
      <h2 class="text-xl font-bold text-[#202B6D]">Konfirmasi Force Close</h2>
      <button
        class="text-gray-400 hover:text-gray-600 text-lg font-bold p-1 cursor-pointer"
        (click)="onCancel()"
      >
        ✕
      </button>
    </div>

    <div class="flex flex-col gap-1 mt-4">
      <p class="text-gray-600 text-sm leading-relaxed">
        Ketika kamu melakukan force close, kamu akan membersihkan data sampah
        yang masih tersangkut di dalam aplikasi.
      </p>
    </div>

    <div class="grid grid-cols-2 gap-3 mt-6">
      <button
        type="button"
        class="w-full btn-no-shadow-secondary text-center cursor-pointer"
        (click)="onCancel()"
      >
        Tutup
      </button>
      <button
        type="button"
        class="w-full btn-no-shadow-danger text-center cursor-pointer"
        (click)="onConfirm()"
      >
        Force Close
      </button>
    </div>
  </div>
</div>
}
