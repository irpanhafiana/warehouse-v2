<div class="w-full h-full flex flex-col bg-checkout overflow-hidden">
  <!-- Top Bar & Controls -->
  <div class="w-full flex flex-col p-4 shrink-0 gap-2">
    <div class="flex flex-row justify-between items-center gap-2">
      <div class="flex flex-col min-w-0">
        <p class="font-semibold text-xs uppercase tracking-wider text-white/70">
          Kirim Antar Toko
        </p>
        <h1 class="font-bold text-xl sm:text-2xl text-white tracking-tight">
          Loading Transfer
        </h1>
      </div>
      <div class="flex flex-row items-center gap-2 shrink-0">
        <button type="button" (click)="getLoadingList()"
          class="w-13 h-13 flex items-center justify-center bg-[#202B6D] hover:bg-[#1a235b] border border-white/20 active:scale-95 rounded-xl p-2.5 transition-all cursor-pointer"
          aria-label="Refresh">
          <img src="refresh-w.png" alt="Refresh" class="w-full h-full object-contain" />
        </button>
        <app-button-home />
      </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-col gap-2 mt-2">
      <div class="grid grid-cols-2 gap-2 items-end">
        <div class="flex flex-col items-start gap-1">
          <label class="font-medium text-xs uppercase tracking-wider text-white/90 pl-1">Tanggal</label>
          <input type="date"
            class="w-full text-sm sm:text-base p-2.5 border border-white/20 focus:border-white focus:outline-none rounded-xl bg-white text-gray-800 font-semibold"
            [(ngModel)]="date" (change)="onDateChange($event)" />
        </div>

        <div class="flex flex-col items-start gap-1">
          <label for="dropdown" class="font-medium text-xs uppercase tracking-wider text-white/90 pl-1">Area</label>
          <select id="dropdown" [(ngModel)]="areaSelected" name="dropdown"
            class="w-full text-sm sm:text-base p-2.5 border border-white/20 focus:border-white focus:outline-none rounded-xl bg-white text-gray-800 font-semibold"
            (change)="onOptionSelect($event)">
            @if (area.length > 0) {
            <option value="">Semua Area</option>
            }
            @for (item of area; track item.Code) {
            <option [value]="item.Code">{{ item.Code }}</option>
            }
            @if (area.length === 0) {
            <option value="" selected>Tidak ada Area</option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Card List -->
  <div class="w-full flex-1 min-h-0 bg-[#F3F2F8] rounded-t-3xl sm:rounded-t-[40px] p-4 flex flex-col overflow-hidden">
    <div class="flex-1 min-h-0 scrollable-body flex flex-col gap-2 pr-1 pb-28">
      @if (loading) {
      <div class="flex flex-col gap-2">
        <app-loader [width]="'w-full'" [height]="'h-[180px]'"></app-loader>
        <app-loader [width]="'w-full'" [height]="'h-[180px]'"></app-loader>
        <app-loader [width]="'w-full'" [height]="'h-[180px]'"></app-loader>
      </div>
      } @else {
      @if (groupResult.length > 0) {
      <div class="flex flex-col gap-2">
        @for (item of groupResult; track item.customerCode) {
        <app-card [dataFrom]="'LOADING'" [salesInvoicesModel]="item"
          (dialogOpen)="openDialogDetailDocnum(item.customerCode, item.data[0].DocNum)"></app-card>
        }
      </div>
      } @else {
      <div class="flex items-center justify-center flex-col pt-16">
        <img src="new-assets/data-not-founds.png" class="w-48 mx-auto object-contain" alt="Not found" />
        <p class="w-3/4 text-center font-medium text-base text-checkout mt-3">
          Ooops, tidak ada BON Loading di tanggal ini :(
        </p>
      </div>
      }
      }
    </div>
  </div>
</div>

<app-navbar-reqtrans></app-navbar-reqtrans>
