<div class="w-full h-screen flex flex-col bg-[#2F4ACD] overflow-hidden">
  <!-- Atas (fix) -->
  <div class="w-full shrink-0 flex flex-col p-4">
    <div class="flex flex-row justify-between gap-2 items-center">
      <div class="flex flex-col">
        <h1 class="font-bold text-2xl text-start text-white">BON Loading</h1>
        <h1 class="font-bold text-2xl text-start text-white">Permintaan Toko</h1>
      </div>
      <div class="flex flex-row gap-2">
        <button
          type="button"
          (click)="getLoadingList()"
          class="w-[60px] h-[60px] flex items-center justify-center bg-[#202B6D] border-4 border-[#19245a] rounded-xl p-2 active:scale-90 transition-transform cursor-pointer"
          aria-label="Refresh"
        >
          <img src="refresh-w.png" alt="Refresh" class="w-full h-full object-contain" />
        </button>
        <app-button-home></app-button-home>
      </div>
    </div>
    <div class="flex flex-col gap-4 mt-4">
      <div class="grid grid-cols-2 gap-2 items-end">
        <div class="flex flex-col items-start gap-2">
          <label class="font-semibold text-xl text-white pl-4">Tanggal</label>
          <input
            type="date"
            class="input-date font-semibold w-full"
            [(ngModel)]="date"
            (change)="onDateChange($event)"
          />
        </div>

        <div class="flex flex-col items-start gap-2">
          <label for="dropdown" class="font-semibold text-xl text-white pl-4">Area</label>
          <select
            id="dropdown"
            [(ngModel)]="areaSelected"
            name="dropdown"
            class="input-date font-semibold tracking-wide w-full"
            (change)="onOptionSelect($event)"
          >
            @if (area.length > 0) {
              <option value="">Lihat Semua</option>
            }

            @for (item of area; track item.Code) {
              <option [value]="item.Code">{{ item.Code }}</option>
            }

            @if (area.length === 0) {
              <option value="" selected>Tidak ada Area</option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Bawah (container list + scrollable) -->
  <div
    class="w-full flex-1 bg-[#F3F2F8] rounded-t-[50px] p-4 flex flex-col border-t-[15px] border-[#202B6D] overflow-hidden"
    [ngClass]="{ 'mt-3': filteredSalesInvoices.length > 0 }"
  >
    <!-- Scrollable List -->
    <div class="flex-1 overflow-y-auto flex flex-col gap-4 pr-1 pb-28">
      @if (loading) {
        <div class="flex flex-col gap-2">
          <app-loader [width]="'w-full'" [height]="'h-[200px]'"></app-loader>
          <app-loader [width]="'w-full'" [height]="'h-[200px]'"></app-loader>
          <app-loader [width]="'w-full'" [height]="'h-[200px]'"></app-loader>
        </div>
      } @else {
        @if (groupResult.length > 0) {
          <div class="flex flex-col gap-3 pb-8">
            @for (item of groupResult; track item.customerCode) {
              <app-card
                [dataFrom]="'LOADING'"
                [salesInvoicesModel]="item"
                (dialogOpen)="openDialogDetailDocnum(item.customerCode, item.data[0].DocNum)"
              ></app-card>
            }
          </div>
        } @else {
          <div class="flex items-center justify-center flex-col pt-20">
            <img src="new-assets/data-not-founds.png" class="w-1/2 max-w-[200px] mx-auto" alt="Not found" />
            <p class="w-2/3 text-center font-medium text-lg text-[#2F4ACD] mt-4">
              Ooops, tidak ada BON Loading di tanggal ini :(
            </p>
          </div>
        }
      }
    </div>
  </div>
</div>

<app-navbar-reqtrans></app-navbar-reqtrans>
